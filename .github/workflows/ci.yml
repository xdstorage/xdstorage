name: xdstorage CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * *'   # nightly: full suite x3 + JMH smoke

jobs:
  gate:
    # C-1: main gate. Verdict comes from Maven's own "BUILD SUCCESS" line — never from a
    # piped grep's exit code (the R-52 shell gotcha: a failed build masqueraded as success).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'          # dev/test runtime; library bytecode stays release=8
          cache: maven
      - name: Build and run full suite (verify — JaCoCo report needs the verify phase, T-1)
        run: |
          mvn clean verify > /tmp/mvn-gate.log 2>&1 || { tail -100 /tmp/mvn-gate.log; exit 1; }
          grep -E "BUILD (SUCCESS|FAILURE)" /tmp/mvn-gate.log
          grep -q "BUILD SUCCESS" /tmp/mvn-gate.log || { echo "BUILD FAILURE detected"; exit 1; }
          grep -E "Tests run: [0-9]+, Failures" /tmp/mvn-gate.log | tail -1
      - name: Artifact check — jar ships no logging backend and no SLF4J binding (L-3)
        run: |
          JAR=$(ls target/xdstorage-*.jar | grep -vE "sources|javadoc" | head -1)
          echo "L-3 artifact check on $JAR"
          if unzip -l "$JAR" | grep -E "org/apache/logging/log4j|META-INF/services/org\.slf4j\.spi\.SLF4JServiceProvider"; then
            echo "LOGGING BACKEND OR SLF4J BINDING CONTENT IN THE JAR — see docs/tasks/2.1.0/03-logging-build-guards.md"
            exit 1
          fi
          echo "jar logging check: CLEAN"
      - name: Archive surefire reports (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
      - name: Archive JaCoCo coverage report (always, T-1)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  nightly:
    # C-2: flake-rate tracking (full suite x3) + JMH smoke with an assertion on the
    # table row count (JMH silently SKIPS failed trials — the row count is the check,
    # BENCHMARKS.md gotcha #1).
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Full suite x3 (flake-rate tracking)
        run: |
          # 2026-10-26: XdStorageNestedTransactionIsolationStressTest (nested tx = NOT
          # RECOMMENDED, 2.2.0 task 12) and XdStorageFacadeStressTest (2.2.0 task 13, the
          # load investigation) are excluded per the maintainer's decision — the surefire
          # '!' prefix is an EXCLUSION (everything else runs).
          for i in 1 2 3; do
            mvn clean test '-Dtest=!XdStorageNestedTransactionIsolationStressTest,!XdStorageFacadeStressTest,!XdStorageMassFillAndCleanFirstStressTest,!XdStorageMassFillAndCleanSecondStressTest,!ForeignKeyManualIdSpecificationTest' > /tmp/mvn-nightly-$i.log 2>&1 || { tail -100 /tmp/mvn-nightly-$i.log; exit 1; }
            grep -E "Tests run: [0-9]+, Failures" /tmp/mvn-nightly-$i.log | tail -1
          done
      - name: JMH smoke (canonical suite, quick mode — BENCH docs/tasks/2.1.0/13)
        id: smoke
        run: |
          # The unified entry point (conditions protocol + manifests). CI runners are
          # dedicated 2-vCPU boxes: the dev-machine loadavg gate is raised here via the
          # documented env override (the manifest records it either way).
          export BENCH_MAX_LOADAVG=8
          bash scripts/run-benchmarks.sh quick
          LOG=$(ls -t target/bench-results/*-quick/jmh-quick.log | head -1)
          CANON=$(grep -c "^XdStorageCanonicalBenchmark\." "$LOG" || true)
          SEARCH=$(grep -c "^XdStorageSearchEngineBenchmark\." "$LOG" || true)
          echo "canonical rows: $CANON, search-engine rows: $SEARCH"
          # the final scenario list (BENCH): 9 canonical CORE rows (commitBatch x4 params,
          # readOnlyTx, writeDataHeavy x2, writeDurable x2) + 14 search-engine rows
          # (incl. the FP-1a/FP-1b shapes absorbed into the canonical set).
          if [ "$CANON" -lt 9 ]; then echo "EXPECTED 9 canonical rows, got $CANON — a trial failed and JMH skipped it silently"; exit 1; fi
          if [ "$SEARCH" -lt 14 ]; then echo "EXPECTED 14 search-engine rows, got $SEARCH — a trial failed and JMH skipped it silently"; exit 1; fi

      # ---- D-4 (docs/tasks/2.1.0/11): persist per-scenario scores, alert on a drop ----

      - name: Extract JMH scores (the dated artifact payload)
        if: always() && steps.smoke.outcome == 'success'
        run: |
          RUN_DIR=$(ls -dt target/bench-results/*-quick | head -1)
          DATE=$(date -u +%F)
          python3 scripts/jmh-scores.py extract "$RUN_DIR/jmh-quick.json" "jmh-scores-$DATE.json"
          cp "jmh-scores-$DATE.json" jmh-scores.json

      - name: Find the previous nightly run (for the D-4 comparison)
        id: prev
        if: always() && steps.smoke.outcome == 'success'
        run: |
          PREV=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?event=schedule&status=success&per_page=5" \
            --jq ".workflow_runs[] | select(.id != ${{ github.run_id }}) | .id" | head -1)
          echo "run_id=$PREV" >> "$GITHUB_OUTPUT"
          echo "previous nightly run: ${PREV:-none}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download the previous scores artifact
        id: download
        if: steps.prev.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: jmh-scores-latest
          path: prev-scores
          run-id: ${{ steps.prev.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Compare against the previous nightly (D-4 regression alert)
        if: steps.download.outcome == 'success'
        run: |
          # The table lands in the job summary; ::warning:: annotations (any scenario
          # >25% slower) flow to the job log. Detection, NOT gating — never fails the run.
          python3 scripts/jmh-scores.py compare prev-scores/jmh-scores.json jmh-scores.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the rolling scores artifact (last nightly wins)
        if: always() && steps.smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: jmh-scores-latest
          path: jmh-scores.json
          retention-days: 90
          overwrite: true

      - name: Upload the dated scores artifact (90-day history)
        if: always() && steps.smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: jmh-scores-${{ github.run_id }}
          path: jmh-scores.json
          retention-days: 90
      - name: Archive nightly logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-logs
          path: |
            /tmp/mvn-nightly-*.log
            /tmp/jmh-smoke.log
          if-no-files-found: ignore
